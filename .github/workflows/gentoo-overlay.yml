name: Gentoo overlay repository

# Publishes contrib/gentoo as the root of the separate repository
# rotdrop/german-word-splitter-gentoo-overlay so that it can be added with
# eselect repository add. Besides the keyword-less live ebuild (9999) an ebuild
# for each of the three most recent releases with keywords "~amd64 ~arm64" is generated from
# it on the fly; it is only part of the overlay, not of this repository.
on:
  release:
    types: [published, edited, deleted]
  push:
    branches: [main]
    paths:
      - contrib/gentoo/**
      - contrib/german-word-splitter.*
      - .github/workflows/gentoo-overlay.yml
  workflow_dispatch:

concurrency:
  group: gentoo-overlay
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Generate ebuilds for the three most recent releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[] | select(.draft | not) | select(.prerelease | not)][0:3] | .[].tag_name' || true)
          if [ -z "$tags" ]; then
            echo "No release found, publishing the live ebuild only."
            exit 0
          fi
          dir=contrib/gentoo/app-misc/german-word-splitter
          pn=german-word-splitter
          : > "$dir/Manifest"
          for tag in $tags; do
            version=${tag#v}
            ebuild=$dir/$pn-$version.ebuild
            distfile=$pn-$version.tar.gz
            url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${tag}.tar.gz"
            curl -fsSL -o "/tmp/$distfile" "$url"
            sed \
              -e 's/^inherit git-r3 /inherit /' \
              -e '/^EGIT_REPO_URI=/d' \
              -e "s|^LICENSE=|SRC_URI=\"${url} -> ${distfile}\"\nS=\"\${WORKDIR}/python-microservice-german-word-splitting-${version}\"\n\nLICENSE=|" \
              -e 's/^IUSE=/KEYWORDS="~amd64 ~arm64"\nIUSE=/' \
              "$dir/$pn-9999.ebuild" > "$ebuild"
            printf 'DIST %s %s BLAKE2B %s SHA512 %s\n' "$distfile" \
              "$(stat -c %s "/tmp/$distfile")" \
              "$(b2sum "/tmp/$distfile" | cut -d' ' -f1)" \
              "$(sha512sum "/tmp/$distfile" | cut -d' ' -f1)" >> "$dir/Manifest"
            cat "$ebuild"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dir"
          git commit -m "Gentoo: add ebuilds for the most recent releases"
      - name: Split contrib/gentoo and push to the overlay repository
        env:
          DEPLOY_KEY: ${{ secrets.OVERLAY_DEPLOY_KEY }}
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/overlay_key
          chmod 600 ~/.ssh/overlay_key
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/overlay_key -o StrictHostKeyChecking=accept-new"
          git subtree split --prefix=contrib/gentoo -b gentoo-split
          git push --force git@github.com:rotdrop/german-word-splitter-gentoo-overlay.git gentoo-split:refs/heads/main
