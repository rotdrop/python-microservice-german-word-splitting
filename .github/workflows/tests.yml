name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run test suite
        run: pytest --cov=german_word_splitter --cov-report=xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.15'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  php-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PHP with cURL
        run: |
          sudo apt-get update
          sudo apt-get install --yes php-cli php-curl
      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run PHP proxy tests
        run: pytest tests/test_php_proxy.py
