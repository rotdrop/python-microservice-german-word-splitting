name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Generate locales used by the transliteration tests
        run: |
          sudo locale-gen de_DE.UTF-8 en_US.UTF-8
          locale -a
      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run test suite
        run: pytest --cov=german_word_splitter --cov-report=xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.15'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  php-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: curl
          coverage: xdebug
          tools: composer
      - name: Install PHP dev dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run PHP proxy tests with coverage
        env:
          XDEBUG_MODE: coverage
        run: |
          export PHP_PROXY_COVERAGE_DIR="$RUNNER_TEMP/php-coverage"
          mkdir -p "$PHP_PROXY_COVERAGE_DIR"
          pytest tests/test_php_proxy.py
          php tests/php/merge_coverage.php "$PHP_PROXY_COVERAGE_DIR" coverage-php.xml
      - name: Upload PHP coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage-php.xml
          flags: php
          token: ${{ secrets.CODECOV_TOKEN }}
