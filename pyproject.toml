[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-microservice-german-word-splitting"
version = "0.6.1"
description = "FastAPI microservice for splitting German compound words"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "compound-split>=1.0.2",
    "fastapi>=0.100,<1.0",
    "german_compound_splitter @ git+https://github.com/rotdrop/german_compound_splitter.git@v0.1.4",
    "uvicorn>=0.23,<1.0",
]

[project.scripts]
german-word-splitter = "german_word_splitter.main:run"

[project.optional-dependencies]
test = [
    "httpx2>=2.0",
    "pytest>=7",
    "pytest-cov>=4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
